global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # campflow-app 컨테이너에 Micrometer(Spring Boot) 붙인 뒤 스크레이프 대상
  # 같은 docker compose 프로젝트(같은 기본 네트워크)에 있으면 컨테이너명으로 접근 가능
  - job_name: "campflow-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
