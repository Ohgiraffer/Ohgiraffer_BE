global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # campflow-app이 로컬(맥)에서 bootRun으로 직접 실행 중인 경우
  # host.docker.internal은 맥/윈도우 Docker에서 호스트 컴퓨터를 가리키는 특수 DNS 이름
  - job_name: "campflow-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
