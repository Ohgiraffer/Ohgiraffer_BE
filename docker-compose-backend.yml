services:
  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: campflow-app
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      MYSQL_HOST: ${DB_HOST}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${DB_NAME:-campflow}
      MYSQL_USERNAME: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-this-is-ohgiraffer-campflow-jwt-secret-key-for-hs256-authentication}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SENDBIRD_APP_ID: ${SENDBIRD_APP_ID:-}
      SENDBIRD_API_TOKEN: ${SENDBIRD_API_TOKEN:-}
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
      GOOGLE_SHEETS_CREDENTIALS_LOCATION: file:/app/secrets/ohgiraffer-sheets-key.json
      GOOGLE_FORMS_ENABLED: ${GOOGLE_FORMS_ENABLED:-false}
      GOOGLE_FORMS_OAUTH_CREDENTIALS_LOCATION: file:/app/secrets/ohgiraffer-forms-oauth-client.json
      GOOGLE_FORMS_TOKEN_DIRECTORY: /app/secrets/forms-tokens
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:?ADMIN_INTERNAL_TOKEN 환경변수가 반드시 설정되어야 합니다}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-90}
      NOTION_API_TOKEN: ${NOTION_API_TOKEN}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID}
      NOTION_TEMPLATE_ID: ${NOTION_TEMPLATE_ID}
      NOTION_API_VERSION: ${NOTION_API_VERSION:-2026-03-11}
      CHATBOT_BOT_USER_ID: ${CHATBOT_BOT_USER_ID:-campflow-ai-assistant}
      CHATBOT_BOT_NICKNAME: ${CHATBOT_BOT_NICKNAME:-AI비서}
      CHATBOT_BOT_CALLBACK_URL: ${CHATBOT_BOT_CALLBACK_URL:-}
      CHATBOT_BOT_TOKEN: ${CHATBOT_BOT_TOKEN:-}
      AUDIT_HASH_SECRET_KEY: ${AUDIT_HASH_SECRET_KEY:-this-is-ohgiraffer-campflow-audit-hash-key-for-auditlog}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-aes128-secretkey}
    volumes:
      - app-logs:/var/log/campflow
      - type: bind
        source: ~/ohgiraffer-sheets-key.json
        target: /app/secrets/ohgiraffer-sheets-key.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ~/ohgiraffer-forms-oauth-client.json
        target: /app/secrets/ohgiraffer-forms-oauth-client.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ~/forms-tokens
        target: /app/secrets/forms-tokens
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: campflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail-backend
    volumes:
      - ./promtail-backend-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

volumes:
  redis-data:
  app-logs: