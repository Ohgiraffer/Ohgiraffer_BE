resilience4j:
  circuitbreaker:
    instances:
      # AI비서 도메인 - 브리핑 생성용 Gemini 호출
      geminiApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - com.ohgiraffer.global.exception.BusinessException

      # 팀 도메인 - Notion 워크스페이스 생성/보관
      teamNotion:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

      # AI비서 도메인 - 챗봇 전용 Gemini 호출 (신규, 값은 초기 추정치, 운영 관찰 후 튜닝 필요)
      geminiApiChatbot:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 15s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - com.ohgiraffer.global.exception.BusinessException

      # 채팅 도메인 - 메시지 전송/수정/삭제용 Sendbird 호출
      # 타임아웃 기준: SendbirdConfig의 CONNECT_TIMEOUT(3s) + READ_TIMEOUT(5s)
      chatSendbirdApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.ohgiraffer.global.exception.BusinessException