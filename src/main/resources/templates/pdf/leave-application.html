<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: 'Noto Sans KR';
            src: url('../../fonts/NotoSansKR-Regular.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Noto Sans KR Medium';
            src: url('../../fonts/NotoSansKR-Medium.ttf') format('truetype');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Noto Sans KR Bold';
            src: url('../../fonts/NotoSansKR-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        @page {
            size: A4;
            margin: 26mm 24mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            color: #111111;
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
        }

        .title {
            text-align: center;
            font-family: 'Noto Sans KR Bold', sans-serif;
            font-size: 24px;
            margin: 0 0 40px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 58px;
        }

        .info-table th {
            width: 130px;
            text-align: left;
            font-family: 'Noto Sans KR Bold', sans-serif;
            padding: 5px 0;
            vertical-align: top;
            white-space: nowrap;
        }

        .info-table td {
            padding: 5px 0;
            border-bottom: 1px solid #dddddd;
        }

        .content {
            text-align: center;
            margin: 0 0 0;
            font-size: 15px;
            line-height: 2.2;
        }

        .date-line {
            font-family: 'Noto Sans KR Bold', sans-serif;
            margin-top: 22px;
        }

        .apply-line {
            margin-top: 18px;
        }

        .signature-table {
            width: 330px;
            margin: 88px auto 0;
            border-collapse: collapse;
        }

        .signature-table th {
            width: 90px;
            text-align: left;
            font-family: 'Noto Sans KR Bold', sans-serif;
            padding: 7px 0;
            vertical-align: middle;
            white-space: nowrap;
        }

        .signature-table td {
            padding: 7px 0;
            vertical-align: middle;
        }

        .signature-image {
            max-width: 110px;
            max-height: 48px;
            vertical-align: middle;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<h1 class="title">휴가 신청서</h1>

<table class="info-table">
    <tr>
        <th>성명</th>
        <td th:text="${studentName}">김훈련</td>
    </tr>
    <tr>
        <th>생년월일</th>
        <td th:text="${birthDate}">2000.01.01</td>
    </tr>
    <tr>
        <th>전화번호</th>
        <td th:text="${phoneNumber}">010-1234-1234</td>
    </tr>
    <tr>
        <th>훈련과정명</th>
        <td th:text="${courseName}">생성형 AI 기반 FE/BE 협업과정</td>
    </tr>
</table>

<div class="content">
    <p>
        위 본인은 주식회사 원티드랩에서<br />
        K-Digital Training 훈련을 받는 중
    </p>

    <p class="date-line">
        <span th:text="${leaveStartDate}">2026.07.07</span>
        ~
        <span th:text="${leaveEndDate}">2026.07.10</span>
        /
        (
        <span th:text="${leaveDays}">1</span>
        )
        일
    </p>

    <p class="apply-line">휴가를 신청합니다.</p>
</div>

<table class="signature-table">
    <tr>
        <th>신청일 :</th>
        <td th:text="${requestedDate}">2026.07.01</td>
    </tr>
    <tr>
        <th>신청자 :</th>
        <td>
            <span th:text="${studentName}">김훈련</span>
            <img
                    class="signature-image"
                    th:if="${requesterSignatureImage != null}"
                    th:src="${requesterSignatureImage}"
                    alt="신청자 서명"
            />
        </td>
    </tr>
    <tr>
        <th>확인자 :</th>
        <td>
            <span th:text="${approverName}">매니저</span>
            <img
                    class="signature-image"
                    th:if="${approverSignatureImage != null}"
                    th:src="${approverSignatureImage}"
                    alt="확인자 서명"
            />
        </td>
    </tr>
</table>
</body>
</html>
