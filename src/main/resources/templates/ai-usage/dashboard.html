<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI 사용량 - CampFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 32px; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: right; }
        th { background: #f2f2f2; }
        td:first-child, th:first-child { text-align: left; }
        .summary { display: flex; gap: 24px; margin-bottom: 24px; }
        .summary div { border: 1px solid #ccc; padding: 12px 20px; }
        canvas { max-width: 700px; margin-bottom: 32px; }
        .fail { color: #c00; }
    </style>
</head>
<body>

<h2>AI 사용량 대시보드 (<span th:text="${today}"></span>)</h2>

<div class="summary">
    <div>오늘 총 호출: <b th:text="${totalCalls}"></b></div>
    <div>실패: <b class="fail" th:text="${failCount}"></b></div>
</div>

<h3>기능별 호출 현황</h3>
<table>
    <thead>
    <tr><th>기능</th><th>성공</th><th>실패</th><th>총 토큰</th></tr>
    </thead>
    <tbody>
    <tr th:each="f : ${byFeature}">
        <td th:text="${f.featureName}"></td>
        <td th:text="${f.successCount}"></td>
        <td class="fail" th:text="${f.failCount}"></td>
        <td th:text="${f.totalTokens}"></td>
    </tr>
    </tbody>
</table>

<h3>실패 원인 분포 (오늘)</h3>
<table>
    <thead><tr><th>원인</th><th>건수</th></tr></thead>
    <tbody>
    <tr th:each="r : ${failReasons}">
        <td th:text="${r.failReason}"></td>
        <td th:text="${r.count}"></td>
    </tr>
    <tr th:if="${failReasons.isEmpty()}">
        <td colspan="2">오늘 실패 없음</td>
    </tr>
    </tbody>
</table>

<h3>시간대별 호출 추이 (429 스파이크 확인용)</h3>
<canvas id="hourlyChart"></canvas>

<script th:inline="javascript">
    const hourly = /*[[${hourly}]]*/ [];
    const labels = hourly.map(h => h.hour + '시');
    const success = hourly.map(h => h.successCount);
    const fail = hourly.map(h => h.failCount);

    new Chart(document.getElementById('hourlyChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: '성공', data: success, backgroundColor: '#4a90d9' },
                { label: '실패', data: fail, backgroundColor: '#d94a4a' }
            ]
        },
        options: {
            responsive: true,
            scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
        }
    });
</script>

</body>
</html>
