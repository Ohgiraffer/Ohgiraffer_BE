spring:
  application:
    name: ohgiraffer

  # ===== Database (MySQL) =====
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:campflow}?characterEncoding=UTF-8&useUnicode=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:campflow}
    password: ${MYSQL_PASSWORD:1234}   # 본인 로컬 비밀번호로 교체
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate          # 마이그레이션이 스키마를 관리하니까 validate 유지
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true

  # ===== Flyway =====
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "baseline from existing schema"
    out-of-order: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/be1
      - classpath:db/migration/be2
      - classpath:db/migration/be3
      - classpath:db/migration/be4
      - classpath:db/migration/be5
      - classpath:db/seed/be1
      - classpath:db/seed/be2
      - classpath:db/seed/be3
      - classpath:db/seed/be4
      - classpath:db/seed/be5

  # ===== Redis (채팅 / 캐시 / 인증코드) =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
    encoding:
      charset: UTF-8
      force: true

google:
  sheets:
    enabled: ${GOOGLE_SHEETS_ENABLED:true}
    application-name: ${GOOGLE_SHEETS_APPLICATION_NAME:ohgiraffer}
    credentials-location: ${GOOGLE_SHEETS_CREDENTIALS_LOCATION:}

  forms:
    enabled: ${GOOGLE_FORMS_ENABLED:false}
    application-name: ${GOOGLE_FORMS_APPLICATION_NAME:ohgiraffer}
    oauth-credentials-location: ${GOOGLE_FORMS_OAUTH_CREDENTIALS_LOCATION:}
    token-directory: ${GOOGLE_FORMS_TOKEN_DIRECTORY:}
    credential-user-key: ${GOOGLE_FORMS_CREDENTIAL_USER_KEY:ohgiraffer-forms-owner}

jwt:
  secret: ${JWT_SECRET:this-is-ohgiraffer-campflow-jwt-secret-key-for-hs256-authentication}
  access-token-validity: ${JWT_ACCESS_VALIDITY:3600000}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:1209600000}

# ===== AWS S3 (영상 / 이미지) =====
cloud:
  aws:
    s3:
      bucket: ohgiraffer-media
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:dummy}
      secret-key: ${AWS_SECRET_ACCESS_KEY:dummy}


# ===== Swagger (SpringDoc) =====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# ===== Logging =====
logging:
  level:
    root: INFO
    com.ohgiraffer: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.data.redis: DEBUG
    org.flywaydb: INFO
  file:
    name: /var/log/campflow/app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

campflow:
  logging:
    service-io: false

# ===== Async =====
app:
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: async-class-
  retry:
    fixed-delay-ms: 5000
  seed-scale: large
  cookie:
    secure: ${COOKIE_SECURE:false}

sendbird:
  app-id: ${SENDBIRD_APP_ID}
  api-token: ${SENDBIRD_API_TOKEN}

# ===== AI =====
ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:90}
  chatbot:
    bot:
      user-id: ${CHATBOT_BOT_USER_ID:campflow-ai-assistant}
      nickname: ${CHATBOT_BOT_NICKNAME:AI비서}
      callback-url: ${CHATBOT_BOT_CALLBACK_URL:}
      token: ${CHATBOT_BOT_TOKEN:}

      
# ==== management =====
management:
  endpoints:
    web:
      exposure:
        # health, prometheus 엔드포인트를 외부에 노출
        # 운영에서는 필요한 것만 최소로 여는 게 안전
        include: health, prometheus, metrics, info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 여러 서비스를 같은 Prometheus로 모을 때 구분용
      application: campflow-app
    distribution:
      # HTTP 요청 지연시간(percentile) 히스토그램 활성화
      # → RED 방법론의 Duration(응답시간) 지표를 나중에 바로 쓸 수 있음
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    instances:
      geminiApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - com.ohgiraffer.global.exception.BusinessException
      # Notion Circuit Breaker
      teamNotion:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      geminiApiChatbot: # 신규 - 챗봇 전용, 값은 초기 추정치(운영 관찰 후 튜닝 필요)
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 15s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - com.ohgiraffer.global.exception.BusinessException

admin:
  internal-token: ${ADMIN_INTERNAL_TOKEN:changeme}

# ===== NOTION =====
notion:
  api-token: ${NOTION_API_TOKEN}
  data-source-id: ${NOTION_DATA_SOURCE_ID}
  template-id: ${NOTION_TEMPLATE_ID}
  api-version: ${NOTION_API_VERSION:2026-03-11}

# ===== OUTBOX =====
team:
  outbox:
    retry-fixed-delay-ms: 60000
    retry-initial-delay-ms: 30000

# ===== hashchain =====
audit:
  hash:
    secret-key: ${AUDIT_HASH_SECRET_KEY:this-is-ohgiraffer-campflow-audit-hash-key-for-auditlog}

# ===== AES =====
encryption:
  aes:
    secret-key: ${AES_SECRET_KEY:aes128-secretkey}

